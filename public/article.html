<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Article — Chronicle</title>

  <script>
    ;(function(g,b,f){
      var s=b.createElement('style');
      s.id=f;s.textContent='body{opacity:0!important}';
      b.head.appendChild(s);
      setTimeout(function(){var n=b.getElementById(f);if(n)n.parentNode.removeChild(n);},g);
    })(3000,document,'at-body-style');
  </script>

  <script>
    window.chronicleData = {};
    window.targetPageParams = function() {
      var d = window.chronicleData || {};
      var p = {};
      if (d.page) {
        p["page.type"] = d.page.type;
        if (d.page.category) p["page.category"] = d.page.category;
      }
      if (d.article && d.article.id) {
        p["entity.id"]         = d.article.id;
        p["entity.categoryId"] = d.article.category || "business";
        p["entity.name"]       = d.article.title || d.article.id;
        p["article.id"]        = d.article.id;
        if (d.article.category) p["article.category"] = d.article.category;
        if (d.article.source)   p["article.source"]   = d.article.source;
      }
      if (d.reader) {
        p["profile.subscription_tier"] = d.reader.tier;
        if (d.reader.topics) p["profile.topics_followed"] = d.reader.topics;
        if (d.reader.region)  p["profile.region"]          = d.reader.region;
      }
      return p;
    };
  </script>

  <!-- Restore article metadata for entity params in the page load request.
       Priority: sessionStorage (card click) → localStorage lookup (populated by any prior homepage/category load). -->
  <script>
    (function() {
      var id = location.pathname.split('/').filter(Boolean).pop() || '';
      var meta = null;

      // 1. Query param — present on every link the site generates (?cat=tech). Zero-lookup, works on cold start.
      var catParam = new URLSearchParams(location.search).get('cat');
      if (catParam) meta = { id: id, category: catParam, title: '', source: '' };

      // 2. sessionStorage — populated by card click handler in the same tab session.
      if (!meta) {
        try {
          var raw = sessionStorage.getItem('chronicle.article-meta');
          if (raw) { var m = JSON.parse(raw); if (m && m.id === id) meta = m; }
        } catch(e) {}
      }

      // 3. localStorage lookup — populated by any prior homepage or category page load.
      if (!meta) {
        try {
          var lookup = JSON.parse(localStorage.getItem('chronicle.article-lookup') || 'null');
          if (lookup && lookup[id]) {
            var lm = lookup[id];
            meta = { id: id, category: lm.category || '', title: lm.title || '', source: lm.source || '' };
          }
        } catch(e) {}
      }

      // Also merge richer metadata (title, source) from sessionStorage/lookup into a query-param-only meta.
      if (meta && (!meta.title || !meta.source)) {
        try {
          var raw2 = sessionStorage.getItem('chronicle.article-meta');
          if (raw2) { var m2 = JSON.parse(raw2); if (m2 && m2.id === id) { meta.title = m2.title || meta.title; meta.source = m2.source || meta.source; } }
        } catch(e) {}
        try {
          var lk = JSON.parse(localStorage.getItem('chronicle.article-lookup') || 'null');
          if (lk && lk[id]) { meta.title = meta.title || lk[id].title || ''; meta.source = meta.source || lk[id].source || ''; }
        } catch(e) {}
      }

      window.chronicleData.page    = { type: "article", category: meta ? meta.category : null, articleId: id };
      window.chronicleData.article = { id: id, title: meta ? meta.title : '', category: meta ? meta.category : '',
                                        source: meta ? meta.source : '', publishedAt: '', readTimeMinutes: 0, tags: [] };
    })();
  </script>

  <!-- Restore reader profile synchronously so profile params reach the page load request -->
  <script>
    (function() {
      var k = 'chronicle.demo.reader';
      var tier = localStorage.getItem(k + '.tier');
      if (!tier) {
        var id = localStorage.getItem(k);
        var map = {
          reader_001:{tier:'premium',topics:'tech,science',region:'IN'},
          reader_002:{tier:'free',topics:'world,culture',region:'IN'},
          reader_003:{tier:'premium',topics:'business,tech',region:'US'},
          reader_004:{tier:'free',topics:'sports,world',region:'UK'},
          reader_005:{tier:'premium',topics:'culture,science',region:'JP'},
          reader_006:{tier:'free',topics:'world,business',region:'MX'},
          reader_007:{tier:'premium',topics:'world,culture,science',region:'AE'},
          reader_008:{tier:'free',topics:'tech',region:'SG'},
          reader_009:{tier:'premium',topics:'culture,business',region:'UK'},
          reader_010:{tier:'free',topics:'sports,tech',region:'IN'}
        };
        var r = id && map[id];
        if (r) {
          tier = r.tier;
          localStorage.setItem(k+'.tier', r.tier);
          localStorage.setItem(k+'.topics', r.topics);
          localStorage.setItem(k+'.region', r.region);
        }
      }
      if (tier) {
        window.chronicleData.reader = {
          tier:   tier,
          topics: localStorage.getItem(k+'.topics') || '',
          region: localStorage.getItem(k+'.region') || ''
        };
      }
    })();
  </script>

  <!-- Early capture: if Launch (async) fires chronicle:experience before chronicle.js loads -->
  <script>
    document.addEventListener('chronicle:experience', function(e) {
      if (e && e.detail) window.chronicleData._offer = e.detail;
    });
  </script>

  <script src="https://assets.adobedtm.com/6a203c8a0ff8/ca9b95c299c0/launch-4940f9569370-development.min.js" async></script>

  <link rel="stylesheet" href="/css/styles.css">
</head>
<body data-page="article">

  <div class="weather-bar">
    <span>Weather and air quality for your region appear here.</span>
    <span>Personalized by location · Adobe Target XT</span>
  </div>

  <header class="site-header">
    <div class="container inner">
      <a href="/" class="site-logo">Chronicle</a>
      <nav class="site-nav" id="site-nav"></nav>
    </div>
  </header>

  <main>
    <div class="container">
      <div id="article-mount" class="target-zone" data-zone="article">
        <p class="loading">Loading…</p>
      </div>
    </div>
  </main>
<section id="related-zone" class="section-wrap target-zone" data-zone="related">
  <h2 class="section-title">Related articles1</h2>
  <div class="recs-placeholder"></div>
</section>
<section id="related-zone2" class="section-wrap target-zone" data-zone="related">
  <h2 class="section-title">Related articles2</h2>
  <div class="recs-placeholder"></div>
</section>
  <footer class="site-footer">
    <div class="container">
      Chronicle is a demo aggregator. Articles link back to their original publishers.
    </div>
  </footer>

  <div id="reader-picker-mount"></div>

  <script src="/js/chronicle.js"></script>
</body>
</html>
