<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chronicle — Personalized News</title>

  <!-- Adobe pre-hiding: keeps body hidden until Target responds (max 3s) -->
  <script>
    ;(function(g,b,f){
      var s=b.createElement('style');
      s.id=f;s.textContent='body{opacity:0!important}';
      b.head.appendChild(s);
      setTimeout(function(){var n=b.getElementById(f);if(n)n.parentNode.removeChild(n);},g);
    })(3000,document,'at-body-style');
  </script>

  <!-- Data layer init + targetPageParams — must be before Launch -->
  <script>
    window.chronicleData = {};
    window.targetPageParams = function() {
      var d = window.chronicleData || {};
      var p = { "at_property": "0ccfef00-23af-86f1-c6bc-2bfe34c1c712" };
      if (d.page) {
        p["page.type"] = d.page.type;
        if (d.page.category) p["page.category"] = d.page.category;
      }
      if (d.reader) {
        p["profile.subscription_tier"] = d.reader.tier;
        if (d.reader.topics) p["profile.topics_followed"] = d.reader.topics;
        if (d.reader.region)  p["profile.region"]          = d.reader.region;
      }
      return p;
    };
  </script>

  <!-- Page-specific data layer -->
  <script>
    window.chronicleData.page = { type: "home", category: null, articleId: null };
  </script>

  <!-- Restore reader profile synchronously so profile params reach the page load request -->
  <script>
    (function() {
      var k = 'chronicle.demo.reader';
      var tier = localStorage.getItem(k + '.tier');
      if (!tier) {
        var id = localStorage.getItem(k);
        var map = {
          reader_001:{tier:'premium',topics:'tech,science',region:'IN'},
          reader_002:{tier:'free',topics:'world,culture',region:'IN'},
          reader_003:{tier:'premium',topics:'business,tech',region:'US'},
          reader_004:{tier:'free',topics:'sports,world',region:'UK'},
          reader_005:{tier:'premium',topics:'culture,science',region:'JP'},
          reader_006:{tier:'free',topics:'world,business',region:'MX'},
          reader_007:{tier:'premium',topics:'world,culture,science',region:'AE'},
          reader_008:{tier:'free',topics:'tech',region:'SG'},
          reader_009:{tier:'premium',topics:'culture,business',region:'UK'},
          reader_010:{tier:'free',topics:'sports,tech',region:'IN'}
        };
        var r = id && map[id];
        if (r) {
          tier = r.tier;
          localStorage.setItem(k+'.tier', r.tier);
          localStorage.setItem(k+'.topics', r.topics);
          localStorage.setItem(k+'.region', r.region);
        }
      }
      if (tier) {
        window.chronicleData.reader = {
          tier:   tier,
          topics: localStorage.getItem(k+'.topics') || '',
          region: localStorage.getItem(k+'.region') || ''
        };
      }
    })();
    
  </script>

  <!-- Early capture: if Launch (async) fires chronicle:experience before chronicle.js loads -->
  <script>
    document.addEventListener('chronicle:experience', function(e) {
      if (e && e.detail) window.chronicleData._offer = e.detail;
    });
  </script>

  <!-- Adobe Launch (Target v2 + Analytics + ECID) -->
  <script src="https://assets.adobedtm.com/6a203c8a0ff8/5671bcd53c9c/launch-88ba9665d70d-development.min.js" async></script>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body data-page="home">

  <div class="weather-bar">
    <span>Weather and air quality for your region appear here.</span>
    <span>Personalized by location · Adobe Target XT</span>
  </div>

  <header class="site-header">
    <div class="container inner">
      <a href="/" class="site-logo">Chronicle</a>
      <nav class="site-nav" id="site-nav"><!-- populated by chronicle.js --></nav>
    </div>
  </header>

  <main>
    <div class="container">
      <div id="homepage-layout" class="target-zone" data-zone="layout">
        <p class="loading">Loading…</p>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      Chronicle is a demo aggregator. Articles link back to their original publishers.
    </div>
  </footer>

  <div id="reader-picker-mount"></div>

  <script src="/js/chronicle.js"></script>
</body>
</html>
